name: live

# Smoke tests against real github.com (react/react). They show when GitHub changes its markup;
# they never block pushes. A failed scheduled run is reported by GitHub's workflow notifications.
on:
    schedule:
        - cron: '0 6 * * 1'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    live:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js 24.x
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: npm
            - run: npm ci
            - name: Install Playwright Chromium
              run: npx --no playwright install --with-deps chromium
            - name: Run live tests (the dist project builds the extension first)
              run: npm run test:live
            - name: Upload the Playwright report
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report-live
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 14
