name: github-markup

# Daily check against the current github.com markup:
# 1. capture fresh snapshots of the react/react pages the e2e tests use,
# 2. commit them to master when they changed,
# 3. run the e2e tests on them and the live smoke tests on github.com.
# When any step fails, one open issue labelled `markup-drift` tracks it: it is created once and
# later failures add a comment to it. Close the issue after fixing the selectors.
on:
    schedule:
        - cron: '0 5 * * *'
    workflow_dispatch:

permissions:
    contents: write
    issues: write

concurrency:
    group: github-markup
    cancel-in-progress: false

jobs:
    markup:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@v7
              with:
                  ref: master
            - name: Use Node.js 24.x
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: npm
            - run: npm ci
            - name: Install Playwright Chromium
              run: npx --no playwright install --with-deps chromium

            - name: Capture fresh snapshots of github.com
              run: npm run test:snapshots

            - name: Commit changed snapshots
              env:
                  # The Husky pre-commit hook (format, build, zip) is for local commits
                  HUSKY: '0'
              run: |
                  if git diff --quiet -- tests/e2e/fixtures/pages; then
                      echo "The snapshots did not change."
                      exit 0
                  fi
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add tests/e2e/fixtures/pages
                  git commit -m "Refresh GitHub page snapshots"
                  git pull --rebase origin master
                  git push origin HEAD:master

            - name: Run e2e tests on the fresh snapshots
              run: npm run test:e2e

            - name: Run live smoke tests on github.com
              run: npm run test:live

            - name: Upload the Playwright report
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report-markup
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 14

            - name: Open or update the markup-drift issue
              if: failure()
              env:
                  GH_TOKEN: ${{ github.token }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  gh label create markup-drift --color D93F0B \
                      --description "The daily check against the current GitHub markup failed" --force
                  number=$(gh issue list --label markup-drift --state open --limit 1 --json number --jq '.[0].number // empty')
                  if [ -n "$number" ]; then
                      gh issue comment "$number" --body "The daily markup check failed again: $RUN_URL"
                      exit 0
                  fi
                  gh issue create --label markup-drift \
                      --title "Tests fail on the current GitHub markup" \
                      --body "The daily markup check failed: $RUN_URL

                  GitHub probably changed the markup of a page the extension or its tests depend on. Open the run, download the \`playwright-report-markup\` artifact (\`npx playwright show-report\`), update the selectors in \`src/content\` (see \`.claude/rules/github-dom-selectors.md\`) and the tests, then close this issue. Later failures are added here as comments until it is closed."
